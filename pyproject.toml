[project]
name = "tacmi"
version = "1.13.1"
description = "This integration monitors the inputs and outputs of the devices connected to a C.M.I."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DeerMaximum", email = "git983456@parabelmail.de" },
]
maintainers = [
    { name = "DeerMaximum", email = "git983456@parabelmail.de" },
]
requires-python = ">=3.14.9"
keywords = [
    "homeassistant",
    "c.m.i.",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "ta-cmi==3.7.1",
]

[project.urls]
homepage = "https://github.com/DeerMaximum/Technische-Alternative-CMI"
repository = "https://github.com/DeerMaximum/Technische-Alternative-CMI"

[dependency-groups]
dev = [
    "aiohttp_cors~=0.8.1",
    "async_timeout==5.0.1",
    "homeassistant==2026.11.1",
    "pytest-homeassistant==2026.11.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    #Fix UnserializableField exception
    "mashumaro>=3.22",
]
lint = [
    "ruff>=0.16.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
preview = true

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.uv]
default-groups = "all"